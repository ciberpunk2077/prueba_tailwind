{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-2">{{ muestra.nombre_cientifico }}</h1>
    <div class="mb-4">
            <a href="{% url 'catalogo:comparador-tipo' 'PLANTA' %}?s1={{ muestra.especie.id }}"
            class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-150">
            <i class="fas fa-exchange-alt mr-2"></i> Comparar especie
        </a>
            <a href="{% url 'catalogo:comparador-tipo' 'PLANTA' %}?s2={{ muestra.especie.id }}"
            class="inline-flex items-center px-4 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition duration-150 ml-3">
            <i class="fas fa-exchange-alt mr-2"></i> Comparar como B
        </a>
    </div>
    <!-- Detalles de la muestra -->
</div>
{% endblock %}
