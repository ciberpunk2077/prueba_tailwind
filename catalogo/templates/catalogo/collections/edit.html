{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Editar Colección</h1>
    
    <form method="post">
      {% csrf_token %}
      
      <div class="space-y-6">
        <div>
          <label for="{{ form.name.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
            Nombre de la colección *
          </label>
          {{ form.name }}
          {% if form.name.errors %}
            <div class="text-red-600 text-sm mt-1">{{ form.name.errors.0 }}</div>
          {% endif %}
        </div>
        
        <div>
          <label for="{{ form.description.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
            Descripción
          </label>
          {{ form.description }}
          {% if form.description.errors %}
            <div class="text-red-600 text-sm mt-1">{{ form.description.errors.0 }}</div>
          {% endif %}
        </div>
      </div>
      
      <div class="flex justify-end gap-4 mt-8">
        <a href="{% url 'catalogo:collection-list' %}" 
           class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
          Cancelar
        </a>
        <button type="submit" 
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
